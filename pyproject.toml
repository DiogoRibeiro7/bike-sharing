[project]
name = "bike-sharing-forecast"
version = "0.5.0"
description = "Reproducible aggregate bike-rental forecasting and evaluation."
authors = [{name = "Diogo Ribeiro"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy (>=2.3,<3)", "scikit-learn (>=1.9,<2)", "threadpoolctl (>=3.6,<4)"]

[project.scripts]
bike-sharing = "bike_sharing.cli:main"
bike-sharing-intervals = "bike_sharing.interval_cli:main"
bike-sharing-planning = "bike_sharing.planning_cli:main"

[tool.poetry]
packages = [{include = "bike_sharing", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16,<0.17"
mypy = ">=2.4,<3"
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
pre-commit = ">=4,<5"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.7,<10"

[build-system]
requires = ["poetry-core>=2.5,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["bike_sharing.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["bike_sharing"]

[tool.coverage.report]
show_missing = true
fail_under = 90

# Third-party estimators do not ship complete type information. Our boundary is typed.
[[tool.mypy.overrides]]
module = ["sklearn.*", "threadpoolctl"]
ignore_missing_imports = true
