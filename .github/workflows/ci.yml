name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install poetry==2.5.1
      - name: Validate and install locked dependencies
        run: |
          poetry check --lock
          poetry install --with dev,docs --no-interaction
      - name: Lint and check types
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
      - name: Verify forecasting contracts
        run: poetry run pytest --cov=bike_sharing --cov-report=term-missing
      - name: Verify historical data evidence offline
        run: poetry run python -m bike_sharing.audit --check benchmarks/data-audit.json
      - name: Compare rolling validation candidates only
        run: poetry run bike-sharing --output results/validation.json
      - name: Assess empirical intervals on validation only
        run: poetry run bike-sharing-intervals --output results/interval-validation.json
      - name: Compare planning policies on validation only
        run: poetry run bike-sharing-planning --output results/planning-validation.json
      - name: Reproduce the frozen final assessment
        run: poetry run python scripts/reproduce_release.py
      - name: Build the LaTeX brief and verify generated tables
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-fonts-recommended lmodern
          poetry run python scripts/build_tables.py
          git diff --exit-code -- brief/*-results.tex docs/assets/generated
          cd brief
          pdflatex -interaction=nonstopmode -halt-on-error decision-brief.tex
          pdflatex -interaction=nonstopmode -halt-on-error decision-brief.tex
      - uses: actions/upload-artifact@v7
        with:
          name: decision-brief
          path: brief/decision-brief.pdf
          if-no-files-found: error
      - name: Build documentation and distributions
        run: |
          poetry run mkdocs build --strict
          poetry build
